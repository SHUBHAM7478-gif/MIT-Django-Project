{% extends "bootstrap.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">

        <div class="card shadow p-4">
        <h3 class="text-center">Login</h3>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="user_name" class="form-control mb-3" placeholder="Username">
            <input type="password" name="user_password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-primary w-100">Login</button>
        </form>

        <p class="mt-3 text-center">
            Don't have account? <a href="{% url 'register' %}">Register</a>
        </p>
        

        {% if error %}
            <p class="text-danger text-center mt-2">
                {{ error }}
            </p>
        {% endif %}

        
        </div>
    </div>
</div>

{% endblock %}
