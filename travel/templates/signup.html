{% extends "bootstrap.html" %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-4">

<div class="card shadow p-4">
<h3 class="text-center">Register</h3>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="user_name" class="form-control mb-3" placeholder="Username">
    <input type="email" name="user_email" class="form-control mb-3" placeholder="Email">
    <input type="password" name="user_password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-success w-100">Register</button>
</form>

</div>
</div>
</div>

{% endblock %}
