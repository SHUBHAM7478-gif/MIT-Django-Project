{% extends "bootstrap.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- Header -->
                <div class="bg-dark text-white text-center py-4">
                    <h2 class="fw-bold">Hotel Booking</h2>
                    <p class="mb-0">Book your comfortable stay with us</p>
                </div>

                <!-- Form Body -->
                <div class="card-body p-5">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Guest Information -->
                        <h5 class="mb-3 text-primary fw-bold">Guest Information</h5>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text"
                                   class="form-control rounded-3"
                                   name="h_name"
                                   placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email"
                                   class="form-control rounded-3"
                                   name="h_email"
                                   placeholder="Enter your email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea class="form-control rounded-3"
                                      rows="3"
                                      name="Address"
                                      placeholder="Enter your address" required></textarea>
                        </div>

                        <!-- Booking Details -->
                        <h5 class="mb-3 text-primary fw-bold">Booking Details</h5>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Check In</label>
                                <input type="date"
                                       class="form-control rounded-3"
                                       name="check_in">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Check Out</label>
                                <input type="date"
                                       class="form-control rounded-3"
                                       name="check_out">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Guests</label>
                            <input type="number"
                                   class="form-control rounded-3"
                                   name="guests"
                                   placeholder="Enter number of guests">
                        </div>

                        <!-- Button -->
                        <button class="btn btn-primary w-100 py-2 rounded-3 fw-bold"
                                type="submit">
                            Confirm Hotel Booking
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
