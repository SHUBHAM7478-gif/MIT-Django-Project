{% extends "bootstrap.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">

            <form method="POST">
                {% csrf_token %}

                <input type="text" name="name" class="form-control mb-3" placeholder="Name">
                <input type="email" name="email" class="form-control mb-3" placeholder="Email">
                <input type="text" name="address" class="form-control mb-3" placeholder="Address">

                <input type="date" name="check_in" class="form-control mb-3" placeholder="TOUR AT">
                <input type="date" name="check_out" class="form-control mb-3" placeholder="TOUR OUT">

                <input type="number" name="guests" class="form-control mb-3" placeholder="Guests">

                <button class="btn btn-primary w-100">Confirm Booking</button>

            </form>

        </div>
    </div>
</div>

{% endblock %}
