<!-- Carousel Start -->

<div id="travelSlider" class="carousel slide carousel-fade mb-5" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#travelSlider" data-bs-slide-to="0" class="active"></button>

        <button type="button" data-bs-target="#travelSlider" data-bs-slide-to="1"></button>

        <button type="button" data-bs-target="#travelSlider" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner rounded shadow">

        <!-- Slide 1 -->
        <div class="carousel-item active">

            <img src="/media/package_image/licensed-image_2.jpeg"
                 class="d-block w-100 slider-img"
                 alt="Goa">

            <div class="carousel-caption d-none d-md-block">
                <h2 class="fw-bold">Explore Beautiful Goa</h2>
                <p>Enjoy beaches and nightlife</p>
            </div>

        </div>

        <!-- Slide 2 -->
        <div class="carousel-item">

            <img src="\media\package_image\kashmir.webp"
                 class="d-block w-100 slider-img"
                 alt="Darjeeling">

            <div class="carousel-caption d-none d-md-block">
                <h2 class="fw-bold">Discover Darjeeling</h2>
                <p>Feel the beauty of mountains</p>
            </div>

        </div>

        <!-- Slide 3 -->
        <div class="carousel-item">

            <img src="/media/package_image/beautiful-nature-destinations-south-india.webp"
                 class="d-block w-100 slider-img"
                 alt="Kerala">

            <div class="carousel-caption d-none d-md-block">
                <h2 class="fw-bold">Visit Kerala</h2>
                <p>Experience nature and backwaters</p>
            </div>

        </div>

    </div>

    <!-- Previous Button -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#travelSlider"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>
    </button>

    <!-- Next Button -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#travelSlider"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- Carousel End -->
