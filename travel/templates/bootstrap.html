<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trip Travels{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }

        html{ scroll-behavior:smooth; }

        body{
            padding-top:0 !important;
            font-family:'Poppins',sans-serif !important;
            color:#0b1320;
            overflow-x:hidden;
            min-height:100vh;
            background:
                radial-gradient(circle at 8% 8%, rgba(245,182,66,.32), transparent 24%),
                radial-gradient(circle at 90% 18%, rgba(0,184,217,.22), transparent 28%),
                radial-gradient(circle at 12% 80%, rgba(245,182,66,.18), transparent 30%),
                radial-gradient(circle at 90% 88%, rgba(0,184,217,.16), transparent 32%),
                linear-gradient(135deg,#fff7e8 0%,#f0fbff 42%,#fffaf2 72%,#eafaff 100%) !important;
            background-attachment:fixed !important;
            animation:pageFade .7s ease;
        }

        @keyframes pageFade{
            from{ opacity:0; transform:translateY(10px); }
            to{ opacity:1; transform:translateY(0); }
        }

       /* SAFE BACKGROUND EFFECT */
        .bg-glow{
            position:fixed;
            width:520px;
            height:520px;
            right:-220px;
            bottom:-220px;
            background:rgba(0,184,217,.18);
            filter:blur(130px);
            border-radius:50%;
            z-index:-1;
            pointer-events:none;
        }

        @keyframes floatGlow{
            0%,100%{ transform:translateY(0); }
            50%{ transform:translateY(-28px); }
        }

        #pageLoader{
            position:fixed;
            inset:0;
            z-index:999999;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                radial-gradient(circle at 20% 20%, rgba(245,182,66,.32), transparent 28%),
                radial-gradient(circle at 80% 80%, rgba(0,184,217,.24), transparent 30%),
                linear-gradient(135deg,#fff7e8,#eefaff,#fffdf7);
            transition:opacity .65s ease, visibility .65s ease;
        }

        #pageLoader.hide-loader{
            opacity:0;
            visibility:hidden;
        }

        .loader-box{
            text-align:center;
            color:#07111f;
        }

        .loader-icon{
            width:74px;
            height:74px;
            border-radius:50%;
            border:5px solid rgba(245,182,66,.20);
            border-top-color:#f5b642;
            border-right-color:#00b8d9;
            animation:spin 1s linear infinite;
            margin:0 auto 20px;
            box-shadow:0 0 38px rgba(245,182,66,.28);
        }

        .loader-text{
            font-family:'Playfair Display',serif;
            font-size:34px;
            font-weight:900;
            letter-spacing:.5px;
        }

        .loader-subtext{
            font-size:12px;
            color:#64748b;
            letter-spacing:3px;
            text-transform:uppercase;
            margin-top:5px;
            font-weight:700;
        }
        #pageLoader.hide-loader{
            opacity:0;
            visibility:hidden;
            pointer-events:none !important;
        }

        @keyframes spin{ to{ transform:rotate(360deg); } }

        .container-fluid{
            padding-left:0 !important;
            padding-right:0 !important;
        }

        main{
            position:relative;
            z-index:2;
        }

        main > .container{
            background:transparent !important;
            padding-top:30px;
            padding-bottom:45px;
        }

        .container{
            position:relative;
            z-index:2;
        }

        img{ max-width:100%; }

        a, button, .btn{ transition:.3s ease; }

        .btn:hover{ transform:translateY(-2px); }

        ::selection{
            background:#f5b642;
            color:#111;
        }

        ::-webkit-scrollbar{ width:10px; }
        ::-webkit-scrollbar-track{ background:#f3fbff; }
        ::-webkit-scrollbar-thumb{
            background:linear-gradient(#f5b642,#ff8a00);
            border-radius:50px;
        }
        /* FIX MODAL + LOADER CONFLICT */
            .modal {
                z-index: 9999999 !important;
            }

            .modal-backdrop {
                z-index: 9999998 !important;
            }

        #pageLoader.hide-loader{
            opacity:0;
            visibility:hidden;
            pointer-events:none;
            display:none !important;
        }
    </style>
</head>

<body>

    <div id="pageLoader">
        <div class="loader-box">
            <div class="loader-icon"></div>
            <div class="loader-text">Trip Travels</div>
            <div class="loader-subtext">Luxury Journey Awaits</div>
        </div>
    </div>

    {% include "header.html" %}

    <div class="container-fluid">
        {% block slide %}{% endblock slide %}
    </div>

    <main>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <div class="container-fluid">
        {% block footer %}{% endblock footer %}
    </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const loader = document.getElementById("pageLoader");

    function hideLoaderFast(){
        if(loader){
            loader.classList.add("hide-loader");
        }
    }

   window.addEventListener("load", function(){
    hideLoaderFast();
   });

    window.addEventListener("pageshow", function(event){
        // browser back/forward korle instant page show hobe
        hideLoaderFast();
    });
    document.querySelectorAll("a").forEach(function(link){

        link.addEventListener("click", function(e){

            // SKIP LOADER FOR WISHLIST
            if(link.classList.contains("no-loader")){
                return;
            }

            const href = link.getAttribute("href");

            if(
                href &&
                !href.startsWith("#") &&
                !href.startsWith("javascript:") &&
                !link.hasAttribute("target")
            ){
                e.preventDefault();

                loader.classList.remove("hide-loader");

                setTimeout(function(){
                    window.location.href = href;
                }, 900);
            }
        });
    });
</script>
<script>
document.addEventListener('shown.bs.modal', function () {
    const loader = document.getElementById("pageLoader");

    if(loader){
        loader.style.display = "none";
    }
});
</script>


</body>
</html>
